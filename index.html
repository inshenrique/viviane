<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bem-vinda, Viviane!</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(circle at top left, #dbeafe, transparent 40%),
                radial-gradient(circle at bottom right, #c7d2fe, transparent 40%),
                linear-gradient(135deg, #f8fafc, #eef2ff);

            color: #1e293b;
        }

        .container {
            width: 90%;
            max-width: 750px;

            text-align: center;

            padding: 60px 40px;

            background: rgba(255, 255, 255, 0.75);

            border: 1px solid rgba(255, 255, 255, 0.9);

            border-radius: 24px;

            box-shadow:
                0 20px 50px rgba(30, 41, 59, 0.12);

            backdrop-filter: blur(12px);
        }

        .texto {
            font-size: 30px;
            font-weight: 400;

            color: #334155;

            line-height: 1.4;
        }

        #viviane {
            display: block;

            margin: 10px 0;

            min-height: 95px;

            font-size: 76px;
            font-weight: 700;

            letter-spacing: 2px;

            color: #1e3a8a;
        }

        .cursor {
            border-right: 4px solid #1e3a8a;

            animation: piscar 0.7s infinite;
        }

        @keyframes piscar {

            0%, 50% {
                border-color: #1e3a8a;
            }

            51%, 100% {
                border-color: transparent;
            }

        }


        /* RELÓGIO */

        .relogio-container {
            margin-top: 45px;
        }

        .relogio-titulo {
            font-size: 14px;

            text-transform: uppercase;

            letter-spacing: 2px;

            color: #64748b;

            margin-bottom: 8px;
        }

        #relogio {
            font-size: 32px;
            font-weight: 600;

            color: #0f172a;

            letter-spacing: 2px;
        }


        /* LINKEDIN */

        .linkedin {
            margin-top: 35px;
        }

        .linkedin a {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            width: 55px;
            height: 55px;

            border-radius: 14px;

            background-color: #0a66c2;

            transition: 0.3s;
        }

        .linkedin a:hover {
            transform: translateY(-5px);

            box-shadow:
                0 10px 20px rgba(10, 102, 194, 0.3);
        }

        .linkedin svg {
            width: 30px;
            height: 30px;

            fill: white;
        }


        /* AJUSTE PARA CELULAR */

        @media (max-width: 600px) {

            .container {
                padding: 45px 20px;
            }

            .texto {
                font-size: 23px;
            }

            #viviane {
                font-size: 55px;
                min-height: 70px;
            }

            #relogio {
                font-size: 27px;
            }

        }

    </style>

</head>


<body>

    <main class="container">

        <div class="texto">

            Seja bem-vinda

            <span id="viviane" class="cursor"></span>

            ao mundo da programação.

        </div>


        <div class="relogio-container">

            <div class="relogio-titulo">
                Horário de Brasília
            </div>

            <div id="relogio">
                00:00:00
            </div>

        </div>


        <div class="linkedin">

            <a
                href="https://www.linkedin.com/"
                target="_blank"
                aria-label="LinkedIn"
                title="Acessar LinkedIn"
            >

                <svg viewBox="0 0 24 24">

                    <path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.32 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.1 20.45H3.54V9H7.1v11.45z"/>

                </svg>

            </a>

        </div>

    </main>


    <script>

        /* ANIMAÇÃO DO NOME */

        const nome = "Viviane";

        const elemento = document.getElementById("viviane");

        let letraAtual = 0;


        function escreverNome() {

            if (letraAtual < nome.length) {

                elemento.textContent += nome.charAt(letraAtual);

                letraAtual++;

                setTimeout(escreverNome, 220);

            }

        }

        escreverNome();



        /* RELÓGIO DE BRASÍLIA */

        function atualizarRelogio() {

            const agora = new Date();

            const horarioBrasilia =
                agora.toLocaleTimeString(
                    "pt-BR",
                    {
                        timeZone: "America/Sao_Paulo",
                        hour: "2-digit",
                        minute: "2-digit",
                        second: "2-digit"
                    }
                );

            document.getElementById("relogio").textContent =
                horarioBrasilia;

        }

        atualizarRelogio();

        setInterval(atualizarRelogio, 1000);

    </script>

</body>

</html>
