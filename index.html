<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bem-vinda, Viviane!</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(circle at top left, #dbeafe, transparent 40%),
                radial-gradient(circle at bottom right, #c7d2fe, transparent 40%),
                linear-gradient(135deg, #f8fafc, #eef2ff);

            color: #1e293b;
        }


        /* TOPO */

        .topo {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;

            padding: 24px 32px;

            display: flex;
            align-items: center;
        }

        .logo-dotiva {
            width: 150px;
            height: auto;
        }


        /* CONTEÚDO PRINCIPAL */

        .pagina {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 120px 20px 40px;
        }

        .container {
            width: 100%;
            max-width: 760px;

            text-align: center;

            padding: 60px 40px;

            background: rgba(255, 255, 255, 0.78);

            border: 1px solid rgba(255, 255, 255, 0.9);

            border-radius: 26px;

            box-shadow:
                0 20px 50px rgba(30, 41, 59, 0.12);

            backdrop-filter: blur(12px);
        }

        .texto {
            font-size: 30px;
            font-weight: 400;

            color: #334155;

            line-height: 1.4;
        }

        #viviane {
            display: block;

            margin: 10px 0;

            min-height: 95px;

            font-size: 76px;
            font-weight: 700;

            letter-spacing: 2px;

            color: #1e3a8a;
        }

        .cursor {
            border-right: 4px solid #1e3a8a;

            animation: piscar 0.7s infinite;
        }

        @keyframes piscar {

            0%, 50% {
                border-color: #1e3a8a;
            }

            51%, 100% {
                border-color: transparent;
            }

        }


        /* RELÓGIO */

        .relogio-container {
            margin-top: 42px;
        }

        .relogio-titulo {
            font-size: 14px;

            text-transform: uppercase;

            letter-spacing: 2px;

            color: #64748b;

            margin-bottom: 8px;
        }

        #relogio {
            font-size: 32px;
            font-weight: 600;

            color: #0f172a;

            letter-spacing: 2px;
        }


        /* REDES SOCIAIS */

        .redes-sociais {
            margin-top: 35px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 14px;
        }

        .rede {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            width: 55px;
            height: 55px;

            border-radius: 14px;

            transition: 0.3s;

            text-decoration: none;
        }

        .rede:hover {
            transform: translateY(-5px);

            box-shadow:
                0 10px 20px rgba(15, 23, 42, 0.18);
        }

        .linkedin {
            background-color: #0a66c2;
        }

        .instagram {
            background:
                radial-gradient(circle at 30% 110%,
                    #fdf497 0%,
                    #fdf497 5%,
                    #fd5949 45%,
                    #d6249f 60%,
                    #285AEB 90%);
        }

        .rede svg {
            width: 29px;
            height: 29px;

            fill: white;
        }


        /* TABLET */

        @media (max-width: 900px) {

            .topo {
                padding: 20px 24px;
            }

            .logo-dotiva {
                width: 135px;
            }

            .container {
                max-width: 680px;
                padding: 50px 30px;
            }

            .texto {
                font-size: 27px;
            }

            #viviane {
                font-size: 68px;
                min-height: 82px;
            }

        }


        /* CELULAR */

        @media (max-width: 600px) {

            .topo {
                position: relative;

                justify-content: center;

                padding: 22px 20px 8px;
            }

            .logo-dotiva {
                width: 125px;
            }

            .pagina {
                min-height: auto;

                padding: 20px 14px 30px;
            }

            .container {
                padding: 38px 20px;

                border-radius: 20px;
            }

            .texto {
                font-size: 21px;
            }

            #viviane {
                font-size: 48px;

                min-height: 60px;

                margin: 8px 0;
            }

            .relogio-container {
                margin-top: 34px;
            }

            .relogio-titulo {
                font-size: 12px;

                letter-spacing: 1.5px;
            }

            #relogio {
                font-size: 27px;
            }

            .rede {
                width: 50px;
                height: 50px;
            }

            .rede svg {
                width: 26px;
                height: 26px;
            }

        }


        /* CELULARES PEQUENOS */

        @media (max-width: 380px) {

            .texto {
                font-size: 19px;
            }

            #viviane {
                font-size: 42px;
            }

            #relogio {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>


    <header class="topo">

        <img
            src="https://dotiva.com.br/imagens/logo.png"
            alt="Logo Dotiva"
            class="logo-dotiva"
        >

    </header>


    <main class="pagina">

        <section class="container">

            <div class="texto">

                Seja bem-vinda

                <span id="viviane" class="cursor"></span>

                ao mundo da programação.

            </div>


            <div class="relogio-container">

                <div class="relogio-titulo">
                    Horário de Brasília
                </div>

                <div id="relogio">
                    00:00:00
                </div>

            </div>


            <div class="redes-sociais">


                <!-- LINKEDIN -->

                <a
                    href="https://www.linkedin.com/"
                    target="_blank"
                    class="rede linkedin"
                    aria-label="LinkedIn"
                    title="Acessar LinkedIn"
                >

                    <svg viewBox="0 0 24 24">

                        <path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.32 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.1 20.45H3.54V9H7.1v11.45z"/>

                    </svg>

                </a>


                <!-- INSTAGRAM -->

                <a
                    href="https://www.instagram.com/"
                    target="_blank"
                    class="rede instagram"
                    aria-label="Instagram"
                    title="Acessar Instagram"
                >

                    <svg viewBox="0 0 24 24">

                        <path d="M7.75 2h8.5C19.43 2 22 4.57 22 7.75v8.5C22 19.43 19.43 22 16.25 22h-8.5C4.57 22 2 19.43 2 16.25v-8.5C2 4.57 4.57 2 7.75 2zm0 2C5.68 4 4 5.68 4 7.75v8.5C4 18.32 5.68 20 7.75 20h8.5C18.32 20 20 18.32 20 16.25v-8.5C20 5.68 18.32 4 16.25 4h-8.5zm8.75 1.5a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>

                    </svg>

                </a>


            </div>

        </section>

    </main>


    <script>

        /* ANIMAÇÃO DO NOME */

        const nome = "Viviane";

        const elemento = document.getElementById("viviane");

        let letraAtual = 0;


        function escreverNome() {

            if (letraAtual < nome.length) {

                elemento.textContent += nome.charAt(letraAtual);

                letraAtual++;

                setTimeout(escreverNome, 220);

            }

        }

        escreverNome();



        /* RELÓGIO DE BRASÍLIA */

        function atualizarRelogio() {

            const agora = new Date();

            const horarioBrasilia =
                agora.toLocaleTimeString(
                    "pt-BR",
                    {
                        timeZone: "America/Sao_Paulo",
                        hour: "2-digit",
                        minute: "2-digit",
                        second: "2-digit"
                    }
                );

            document.getElementById("relogio").textContent =
                horarioBrasilia;

        }

        atualizarRelogio();

        setInterval(atualizarRelogio, 1000);

    </script>


</body>

</html>
