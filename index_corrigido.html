<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viviane no mundo da programação</title>

  <!-- FullCalendar 7.1.0: bundle padrão -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/all/global.js"></script>

  <!-- FullCalendar 7.1.0: tema Classic -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/themes/classic/global.js"></script>

  <!-- CSS oficiais do FullCalendar 7.1.0 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/skeleton.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/themes/classic/theme.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/themes/classic/palette.css">

  <style>
    * { box-sizing: border-box; }

    :root {
      --fundo-1: #f8fafc;
      --fundo-2: #eaf1ff;
      --card: rgba(255,255,255,.84);
      --texto: #334155;
      --texto-forte: #0f172a;
      --azul: #173d7a;
      --borda: rgba(255,255,255,.9);
      --sombra: 0 25px 60px rgba(15,23,42,.12);
    }

    body.dark {
      --fundo-1: #0f172a;
      --fundo-2: #18253d;
      --card: rgba(30,41,59,.86);
      --texto: #cbd5e1;
      --texto-forte: #f8fafc;
      --azul: #60a5fa;
      --borda: rgba(255,255,255,.08);
      --sombra: 0 25px 60px rgba(0,0,0,.35);
    }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--texto);
      background:
        radial-gradient(circle at 10% 15%, rgba(96,165,250,.35), transparent 32%),
        radial-gradient(circle at 90% 85%, rgba(99,102,241,.25), transparent 35%),
        linear-gradient(135deg, var(--fundo-1), var(--fundo-2));
      transition: background .5s, color .5s;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      width: 420px;
      height: 420px;
      top: -160px;
      right: -100px;
      border-radius: 50%;
      background: rgba(59,130,246,.14);
      filter: blur(30px);
      animation: moverFundo 9s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes moverFundo {
      from { transform: translate(0,0) scale(1); }
      to { transform: translate(-70px,70px) scale(1.2); }
    }

    .topo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 25px 35px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .logo-dotiva {
      width: 155px;
      height: auto;
    }

    .botao-tema {
      width: 48px;
      height: 48px;
      border: 1px solid var(--borda);
      border-radius: 14px;
      background: var(--card);
      color: var(--texto-forte);
      font-size: 21px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(15,23,42,.08);
      transition: .3s;
    }

    .botao-tema:hover { transform: translateY(-3px) rotate(6deg); }

    .pagina {
      min-height: 100vh;
      padding: 125px 20px 55px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 850px;
      padding: 60px 50px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--borda);
      border-radius: 30px;
      box-shadow: var(--sombra);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .intro {
      font-size: clamp(23px,3vw,32px);
      line-height: 1.45;
    }

    #viviane {
      display: block;
      margin: 9px 0;
      min-height: 96px;
      font-size: clamp(50px,9vw,82px);
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -2px;
      color: var(--azul);
      text-shadow: 0 0 30px rgba(59,130,246,.15);
      transition: .4s;
    }

    #viviane.brilho {
      text-shadow:
        0 0 8px rgba(59,130,246,.35),
        0 0 25px rgba(59,130,246,.25),
        0 0 50px rgba(59,130,246,.18);
      transform: scale(1.025);
    }

    .subtitulo {
      margin-top: 20px;
      font-size: 16px;
      opacity: .75;
    }

    .area-calendario {
      margin-top: 55px;
      padding: 28px;
      background: rgba(255,255,255,.38);
      border: 1px solid var(--borda);
      border-radius: 22px;
      text-align: left;
    }

    body.dark .area-calendario {
      background: rgba(15,23,42,.30);
    }

    .titulo-secao {
      margin: 0 0 22px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      opacity: .65;
    }

    /* Ajustes visuais por cima do tema Classic */
    .fc { color: var(--texto-forte); }

    .fc .fc-toolbar-title {
      font-size: 20px;
      font-weight: 700;
    }

    .fc .fc-button {
      border-radius: 9px;
    }

    .fc .fc-day-today {
      background: rgba(59,130,246,.12) !important;
    }

    .relogio-container { margin-top: 45px; }

    .relogio-titulo {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      opacity: .6;
      margin-bottom: 10px;
    }

    #relogio {
      font-size: clamp(30px,6vw,42px);
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--texto-forte);
    }

    #data {
      margin-top: 7px;
      font-size: 16px;
      opacity: .75;
    }

    .redes-sociais {
      margin-top: 38px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .rede {
      height: 50px;
      padding: 0 18px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
      color: white;
      font-weight: 600;
      font-size: 14px;
      transition: .3s;
      box-shadow: 0 8px 20px rgba(15,23,42,.12);
    }

    .rede:hover { transform: translateY(-5px); }

    .linkedin { background: #0a66c2; }

    .instagram {
      background: radial-gradient(circle at 30% 110%, #fdf497 0%, #fd5949 45%, #d6249f 65%, #285aeb 95%);
    }

    .rede svg {
      width: 23px;
      height: 23px;
      fill: white;
    }

    footer {
      margin-top: 50px;
      padding-top: 25px;
      border-top: 1px solid rgba(100,116,139,.18);
      font-size: 13px;
      opacity: .6;
    }

    @media (max-width: 600px) {
      .topo {
        position: relative;
        padding: 20px 18px 5px;
      }

      .logo-dotiva { width: 125px; }

      .pagina {
        min-height: auto;
        padding: 18px 12px 30px;
      }

      .container {
        padding: 38px 17px;
        border-radius: 22px;
      }

      #viviane {
        min-height: 62px;
        letter-spacing: -1px;
      }

      .area-calendario {
        margin-top: 40px;
        padding: 16px 9px;
      }

      .fc .fc-toolbar {
        flex-direction: column;
        gap: 10px;
      }

      .fc .fc-toolbar-title { font-size: 18px; }

      .rede {
        width: 52px;
        padding: 0;
        justify-content: center;
      }

      .rede span { display: none; }
    }
  </style>
</head>

<body>

  <header class="topo">
    <img
      src="https://dotiva.com.br/imagens/logo.png"
      alt="Logo Dotiva"
      class="logo-dotiva"
    >

    <button
      id="botaoTema"
      class="botao-tema"
      aria-label="Alternar tema"
      title="Alterar tema"
    >☾</button>
  </header>

  <main class="pagina">
    <section class="container">

      <div class="intro">
        Seja bem-vinda
        <span id="viviane"></span>
        ao mundo da programação.
      </div>

      <div class="subtitulo">
        Meu primeiro projeto publicado na web.
      </div>

      <div class="area-calendario">
        <div class="titulo-secao">Calendário</div>
        <div id="calendar"></div>
      </div>

      <div class="relogio-container">
        <div class="relogio-titulo">Horário de Brasília</div>
        <div id="relogio">00:00:00</div>
        <div id="data"></div>
      </div>

      <div class="redes-sociais">

        <a
          href="https://www.linkedin.com/"
          target="_blank"
          rel="noopener noreferrer"
          class="rede linkedin"
          aria-label="LinkedIn"
        >
          <svg viewBox="0 0 24 24">
            <path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.32 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.1 20.45H3.54V9H7.1v11.45z"/>
          </svg>
          <span>LinkedIn</span>
        </a>

        <a
          href="https://www.instagram.com/"
          target="_blank"
          rel="noopener noreferrer"
          class="rede instagram"
          aria-label="Instagram"
        >
          <svg viewBox="0 0 24 24">
            <path d="M7.75 2h8.5C19.43 2 22 4.57 22 7.75v8.5C22 19.43 19.43 22 16.25 22h-8.5C4.57 22 2 19.43 2 16.25v-8.5C2 4.57 4.57 2 7.75 2zm0 2C5.68 4 4 5.68 4 7.75v8.5C4 18.32 5.68 20 7.75 20h8.5C18.32 20 20 18.32 20 16.25v-8.5C20 5.68 18.32 4 16.25 4h-8.5zm8.75 1.5a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>
          </svg>
          <span>Instagram</span>
        </a>

      </div>

      <footer>Feito por Viviane • 2026</footer>

    </section>
  </main>

  <script>
    /* Animação do nome */
    const nome = "Viviane";
    const elementoViviane = document.getElementById("viviane");
    let letraAtual = 0;
    let temporizadorDigitacao;

    function escreverNome() {
      if (letraAtual < nome.length) {
        elementoViviane.textContent += nome.charAt(letraAtual);
        letraAtual++;
        temporizadorDigitacao = setTimeout(escreverNome, 180);
      } else {
        elementoViviane.classList.add("brilho");
        setTimeout(() => elementoViviane.classList.remove("brilho"), 1300);
      }
    }

    function reiniciarAnimacaoNome() {
      clearTimeout(temporizadorDigitacao);
      elementoViviane.textContent = "";
      elementoViviane.classList.remove("brilho");
      letraAtual = 0;
      escreverNome();
    }

    escreverNome();
    setInterval(reiniciarAnimacaoNome, 10000);

    /* Relógio e data de Brasília */
    function atualizarRelogio() {
      const agora = new Date();

      document.getElementById("relogio").textContent =
        agora.toLocaleTimeString("pt-BR", {
          timeZone: "America/Sao_Paulo",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        });

      let dataBrasilia = agora.toLocaleDateString("pt-BR", {
        timeZone: "America/Sao_Paulo",
        weekday: "long",
        day: "2-digit",
        month: "long",
        year: "numeric"
      });

      dataBrasilia =
        dataBrasilia.charAt(0).toUpperCase() + dataBrasilia.slice(1);

      document.getElementById("data").textContent = dataBrasilia;
    }

    atualizarRelogio();
    setInterval(atualizarRelogio, 1000);

    /* FullCalendar */
    document.addEventListener("DOMContentLoaded", function () {
      const elementoCalendario = document.getElementById("calendar");

      const calendario = new FullCalendar.Calendar(elementoCalendario, {
        plugins: [
          FullCalendarClassicTheme.default
        ],
        initialView: "dayGridMonth",
        locale: "pt-br",
        firstDay: 0,
        height: "auto",
        fixedWeekCount: false,
        showNonCurrentDates: true,
        headerToolbar: {
          start: "prevYear,prev",
          center: "title",
          end: "next,nextYear"
        }
      });

      calendario.render();
    });

    /* Tema claro/escuro */
    const botaoTema = document.getElementById("botaoTema");

    botaoTema.addEventListener("click", function () {
      document.body.classList.toggle("dark");

      botaoTema.textContent =
        document.body.classList.contains("dark") ? "☀" : "☾";
    });
  </script>

</body>
</html>
